<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Builder - dev demo</title>
  <style>
    body { font-family: system-ui, Segoe UI, sans-serif; margin: 0; background: #eef1f5; color: #222; }
    header { background: #1a4f8a; color: #fff; padding: 10px 16px; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: .8; }
    .demo-wrap { padding: 16px; max-width: 1440px; margin: 0 auto; }
    #builder { height: 660px; background: #fff; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-size: 13px; }
    .controls button { padding: 5px 10px; }
    .xml-panel { margin-top: 16px; }
    .xml-panel label { font-size: 13px; }
    .xml-panel textarea { width: 100%; height: 190px; margin-top: 6px; font-family: Consolas, "Courier New", monospace; font-size: 12px; box-sizing: border-box; }

    /* Deliberately hostile host-app styles, to prove Shadow DOM isolation. */
    body.hostile * { font-family: "Comic Sans MS", cursive !important; }
    body.hostile button { background: orange !important; color: darkred !important; border: 3px dotted purple !important; }
    body.hostile table, body.hostile td, body.hostile th { border: 2px solid red !important; }
    body.hostile input, body.hostile select, body.hostile textarea { background: pink !important; }
  </style>
</head>
<body>
  <header>
    <h1>Domino View Builder - dev demo</h1>
    <p>This page stands in for a complex XPages host app. The component is mounted with a single call.</p>
  </header>

  <div class="demo-wrap">
    <div class="controls">
      <button id="toggleHostile" type="button">Toggle hostile host styles</button>
      <span>Shows the component stays isolated thanks to Shadow DOM.</span>
      <label for="language">Language:</label>
      <select id="language">
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </div>

    <div id="builder"></div>

    <div class="xml-panel">
      <label for="liveXml"><b>Live XML</b> (serialized design, updated on every change)</label>
      <textarea id="liveXml" readonly></textarea>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
