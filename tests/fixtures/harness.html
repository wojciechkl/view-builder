<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ViewBuilder E2E harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #host, #host2 { width: 1180px; height: 680px; }
  #autoHost, #autoXmlHost, #roHost, #autoReadonlyHost { width: 1180px; height: 680px; }
  .spacer { height: 8px; }
</style>
</head>
<body>
<div id="host"></div>
<div id="host2"></div>
<div id="roHost"></div>
<div id="autoHost" data-view-builder></div>
<div id="autoXmlHost" data-view-builder data-xml="autoXml"></div>
<div id="autoReadonlyHost" data-view-builder data-xml="autoXml" data-readonly="true"></div>

<script type="text/xml" id="autoXml">
<viewTemplate alternateRows="false">
  <name>AutoXmlView</name>
  <alias>vAuto</alias>
  <selectionFormula>SELECT Form = "Memo"</selectionFormula>
  <column width="150" sorted="true">
    <title>DocSubject</title>
    <formula>Subject</formula>
    <programmaticName>DocSubject</programmaticName>
  </column>
</viewTemplate>
</script>

<script src="../../dist/view-builder.js"></script>
<script>
  window.__changes = [];
  window.__events = [];
  window.__builder = null;

  window.mountBuilder = function (options) {
    var host = document.getElementById('host');
    var opts = Object.assign({}, options || {});
    if (!opts.design) opts.design = window.ViewBuilder.createSampleDesign();
    var userChange = opts.onChange;
    opts.onChange = function (design) {
      window.__changes.push(design);
      if (userChange) userChange(design);
    };
    var builder = window.ViewBuilder.mount(host, opts);
    window.__builder = builder;
    host.addEventListener('viewbuilder:change', function (e) {
      window.__events.push(e.detail.design.name);
    });
    return builder;
  };

  window.mountBuilderReadonly = function (options) {
    var opts = Object.assign({}, options || {});
    if (!opts.design) opts.design = window.ViewBuilder.createSampleDesign();
    opts.readonly = true;
    return window.ViewBuilder.mount('#roHost', opts);
  };

  window.mountBuilder2 = function (options) {
    return window.ViewBuilder.mount('#host2', options || {});
  };
</script>
</body>
</html>
